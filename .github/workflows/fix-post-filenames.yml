name: Fix Jekyll Post Filenames

on:
  push:
    paths:
      - '_posts/**'

jobs:
  rename-posts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepend date to post filenames
        run: |
          cd _posts
          changed=false
          for f in *.md; do
            # Skip files already prefixed with a date
            if [[ "$f" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}- ]]; then
              continue
            fi
            # Extract date from frontmatter (handles both 2026-02-16 and 2026-02-16T12:00:00 formats)
            date=$(grep -m1 -oP '^date:\s*['\''"]?\K[0-9]{4}-[0-9]{2}-[0-9]{2}' "$f" || true)
            if [ -n "$date" ]; then
              # Slugify the filename: lowercase, spaces to hyphens, remove special chars
              slug=$(echo "$f" | sed 's/\.md$//' | tr '[:upper:]' '[:lower:]' | tr ' ' '-' | sed 's/[^a-z0-9-]//g' | sed 's/--*/-/g' | sed 's/^-//;s/-$//')
              newname="${date}-${slug}.md"
              if [ "$f" != "$newname" ]; then
                mv "$f" "$newname"
                echo "Renamed: $f -> $newname"
                changed=true
              fi
            else
              echo "WARNING: No date found in frontmatter for $f — skipping"
            fi
          done
          echo "changed=$changed" >> "$GITHUB_ENV"

      - name: Commit renamed files
        if: env.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _posts/
          git diff --staged --quiet || git commit -m "Auto-prepend dates to post filenames"
          git push
